<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 · FileHub</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">

<a class="brand brand-top" href="/">
  <span class="brand-mark">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
  </span>
  <span>FileHub</span>
</a>

<main class="auth-card">
  {% if success %}
  <h1>申请已提交</h1>
  <p class="auth-tip">账号 <strong>{{ username }}</strong> 正在等待管理员审批</p>
  <div class="alert alert-ok">审批通过后即可用该账号登录，届时你的文件空间会自动创建。管理员可用「重置密码」为你生成临时密码。</div>
  <a class="btn btn-primary btn-block" href="{{ url_for('login') }}">返回登录</a>
  {% else %}
  <h1>注册账号</h1>
  <p class="auth-tip">注册后需管理员审批才能登录</p>

  {% if error %}
  <div class="alert">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('register') }}" autocomplete="off">
    <label class="field">
      <span>用户名</span>
      <input type="text" name="username" required autofocus maxlength="32" value="{{ form.username or '' }}" placeholder="3-32 位字母、数字、_ . -">
    </label>
    <label class="field">
      <span>密码</span>
      <input type="password" name="password" required minlength="8" maxlength="128" placeholder="至少 8 位">
    </label>
    <label class="field">
      <span>确认密码</span>
      <input type="password" name="confirm" required minlength="8" maxlength="128">
    </label>
    <button class="btn btn-primary btn-block" type="submit">提交注册申请</button>
  </form>

  <a class="auth-back" href="{{ url_for('login') }}">已有账号？去登录</a>
  {% endif %}
</main>

</body>
</html>
